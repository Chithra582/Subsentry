name: email-subscription-parser
description: Parse raw email receipt text to extract subscription metadata while redacting PII.
input_schema:
  type: object
  properties:
    email_subject:
      type: string
      description: The subject line of the billing email.
    email_body:
      type: string
      description: The raw or sanitized text content of the invoice email.
    sender_domain:
      type: string
      description: Email domain of the billing provider (e.g. netflix.com, github.com).
  required:
    - email_subject
    - email_body
    - sender_domain
